<svg width="795" height="180" viewBox="0 0 795 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="badge-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.08"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Ubuntu, sans-serif; }
    </style>
  </defs>
  <!-- Card background -->
  <rect width="795" height="180" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>
  <!-- Hero greeting -->
  <text x="28" y="48" font-size="26" font-weight="800" fill="#e6edf3">Hey! I'm </text>
  <text x="148" y="48" font-size="26" font-weight="800" fill="#58a6ff">Naman</text>
  <text x="237" y="48" font-size="26" font-weight="800" fill="#e6edf3"> 👋</text>
  <!-- Building in public badge -->
  <rect x="590" y="20" width="178" height="32" rx="16" fill="url(#badge-bg)" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="598" y="40" font-size="13" fill="#58a6ff" font-weight="600">💡 Building in Public</text>
  <!-- Tagline -->
  <text x="28" y="75" font-size="14" fill="#8b949e">I turn ideas into reality with code.</text>
  <!-- Bullets -->
  <text x="28" y="105" font-size="13.5" fill="#e6edf3">💻 Full Stack Developer | MERN Stack</text>
  <text x="28" y="128" font-size="13.5" fill="#e6edf3">🤖 AI Enthusiast | LLMs | Automation</text>
  <text x="28" y="151" font-size="13.5" fill="#e6edf3">🚀 Open Source Contributor</text>
  <text x="28" y="168" font-size="13" fill="#8b949e">🎯 Focused on building impactful products</text>
</svg>
