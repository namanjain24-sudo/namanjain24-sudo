  <!-- GitHub -->
  <rect x="16"  y="462" width="36" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="34"  y="485" font-size="18" text-anchor="middle">⌂</text>
  <!-- LinkedIn -->
  <rect x="60"  y="462" width="36" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="78"  y="485" font-size="16" text-anchor="middle" fill="#0077b5">in</text>
  <!-- Twitter -->
  <rect x="104" y="462" width="36" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="122" y="485" font-size="15" text-anchor="middle" fill="#1da1f2">𝕏</text>
  <!-- Instagram -->
  <rect x="148" y="462" width="36" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="166" y="485" font-size="16" text-anchor="middle">📸</text>
  <!-- Email -->
  <rect x="192" y="462" width="36" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
