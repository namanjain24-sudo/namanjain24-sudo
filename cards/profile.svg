  <text x="26" y="280" font-size="12.5" fill="#8b949e">✉  namanjain.work@gmail.com</text>
  <text x="26" y="300" font-size="12.5" fill="#8b949e">🌐 namanjain.dev</text>
  <text x="26" y="320" font-size="12.5" fill="#8b949e">🐦 @namanjain_</text>
  <text x="26" y="340" font-size="12.5" fill="#8b949e">📅 Joined Jan 2023</text>

  <!-- View Resume button -->
