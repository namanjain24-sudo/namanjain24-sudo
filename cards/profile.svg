<svg width="260" height="520" viewBox="0 0 260 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="130" cy="76" r="52"/>
    </clipPath>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#58a6ff"/>
      <stop offset="33%"  stop-color="#a371f7"/>
      <stop offset="66%"  stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <style>text { font-family: -apple-system, 'Segoe UI', Ubuntu, sans-serif; }</style>
  </defs>
  <rect width="260" height="520" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Animated ring (static gradient circle) -->
  <circle cx="130" cy="76" r="57" fill="url(#ring-grad)"/>
  <!-- Avatar from GitHub -->
  <image href="https://github.com/namanjain24-sudo.png" x="78" y="24" width="104" height="104" clip-path="url(#avatar-clip)"/>

  <!-- Name -->
  <text x="130" y="155" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle">Naman Jain</text>
  <!-- Role -->
  <text x="130" y="173" font-size="13" font-weight="500" fill="#58a6ff" text-anchor="middle">Full Stack Developer</text>
  <!-- Bio -->
  <text x="130" y="196" font-size="12" fill="#8b949e" text-anchor="middle">Building scalable web apps and</text>
  <text x="130" y="211" font-size="12" fill="#8b949e" text-anchor="middle">AI-powered solutions that solve</text>
  <text x="130" y="226" font-size="12" fill="#8b949e" text-anchor="middle">real-world problems.</text>

  <!-- Divider -->
  <line x1="16" y1="238" x2="244" y2="238" stroke="#30363d" stroke-width="1"/>

  <!-- Meta items -->
